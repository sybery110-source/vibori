<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Выборы 2026 — Штаб кампании</title>
<style>
:root {
    --accent: #0066cc;
    --accent-2: #8e44ad;
    --accent-soft: #eaf3ff;
    --bg: #f0f6ff;
    --bg-2: #e6f0ff;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #6b7a90;
    --border: #cfe0f5;
    --border-strong: #0066cc;
    --radius: 16px;
    --radius-sm: 12px;
    --shadow-sm: 0 2px 8px rgba(0,102,204,.08);
    --shadow-md: 0 6px 20px rgba(0,102,204,.12);
    --shadow-lg: 0 14px 40px rgba(0,102,204,.18);
    --grad: linear-gradient(135deg,#0066cc,#8e44ad);
    --green: #16a34a;
    --red: #dc2626;
    --orange: #d97706;
    --purple: #8e44ad;
}
body.dark-theme {
    --accent-soft: #16233d;
    --bg: #0d1526;
    --bg-2: #111c33;
    --card: #18233d;
    --text: #eaf1ff;
    --muted: #92a3bd;
    --border: #2a3a5c;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
    --shadow-md: 0 6px 20px rgba(0,0,0,.45);
    --shadow-lg: 0 14px 40px rgba(0,0,0,.55);
    --green: #4ade80;
    --red: #f87171;
    --orange: #fbbf24;
    --purple: #a78bfa;
}
* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent !important;
}
html { -webkit-text-size-adjust: 100%; }
body {
    background: var(--bg); color: var(--text);
    min-height: 100vh; line-height: 1.5;
    overflow-x: hidden;
    transition: background .35s ease, color .35s ease;
    font-size: 16px;
}
.container { max-width: 900px; margin: 0 auto; padding: 18px; }
.page { display: none; }
.page.active { display: block; }
header { text-align: center; padding: 24px 0 10px; position: relative; }
h1 {
    font-size: clamp(1.8rem, 6vw, 2.6rem);
    font-weight: 800; letter-spacing: -.01em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}
.subtitle { font-size: 1rem; color: var(--muted); }
.theme-toggle {
    position: fixed; top: 16px; right: 16px;
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--card); color: var(--accent);
    font-size: 1.4rem; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: var(--shadow-md);
    z-index: 100;
}
.content-block {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 22px 18px;
    box-shadow: var(--shadow-sm);
}
.content-block h2 {
    color: var(--accent); text-align: center;
    margin-bottom: 18px; font-size: 1.5rem; font-weight: 800;
}
.party-card {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 18px 16px; margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    display: flex; align-items: center; gap: 14px;
}
.party-flag {
    width: 64px; height: 64px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 1.1rem;
    flex-shrink: 0; border: 2px solid var(--border);
    overflow: hidden;
}
.party-flag img {
    width: 100%; height: 100%;
    object-fit: cover; padding: 0; display: block;
}
.party-info { flex: 1; min-width: 0; }
.party-info h3 { font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
.party-info .party-leader { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.party-info .party-desc { font-size: .85rem; color: var(--muted); line-height: 1.4; }
.party-stats { text-align: right; flex-shrink: 0; }
.party-stats .stat-start { color: var(--accent); font-weight: 900; font-size: 1.2rem; }
.party-stats .stat-label { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.party-stats .stat-difficulty { color: var(--orange); font-size: .9rem; letter-spacing: 2px; margin-top: 4px; }
.hud {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 8px; margin-bottom: 16px;
}
.hud-item {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 10px 8px; text-align: center;
    box-shadow: var(--shadow-sm);
}
.hud-icon { font-size: 1.3rem; margin-bottom: 4px; }
.hud-value {
    font-size: 1rem; font-weight: 800;
    color: var(--accent); font-variant-numeric: tabular-nums;
}
.hud-label {
    font-size: .68rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-top: 2px;
}
.hud-sub {
    font-size: .68rem; font-weight: 800;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
}
.hud-item.gold .hud-value { color: var(--orange); }
.hud-item.danger .hud-value { color: var(--red); }
.hud-item.good .hud-value { color: var(--green); }
.hud-item.special .hud-value { color: var(--purple); }
.hud-sub.pos { color: var(--green); }
.hud-sub.neg { color: var(--red); }
.region-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 14px; margin-bottom: 16px;
}
.region-card {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 16px;
}
.region-card.owned {
    border-color: var(--green);
    background: linear-gradient(135deg, rgba(22,163,74,.06), var(--card));
}
.region-header {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 12px; gap: 8px;
}
.region-name { font-size: 1.05rem; font-weight: 800; color: var(--text); }
.region-weight {
    font-size: .72rem; font-weight: 800;
    color: var(--orange); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 999px;
}
.region-parties {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 10px;
}
.region-party-row {
    display: grid;
    grid-template-columns: 100px 1fr 46px;
    align-items: center; gap: 8px;
    font-size: .82rem;
}
.region-party-name {
    font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.region-party-bar {
    height: 8px; background: var(--accent-soft);
    border-radius: 999px; overflow: hidden;
}
.region-party-fill {
    height: 100%; border-radius: 999px;
}
.region-party-pct {
    font-weight: 800; font-variant-numeric: tabular-nums;
    text-align: right; font-size: .85rem;
}
.region-party-row.me .region-party-name { font-weight: 900; }
.region-party-row.me .region-party-pct { font-weight: 900; }
.region-tags {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding-top: 10px; border-top: 1px dashed var(--border);
}
.region-tag {
    font-size: .68rem; padding: 3px 10px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; font-weight: 700;
}
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tab {
    padding: 10px 20px; border-radius: 999px;
    border: 2px solid var(--border-strong);
    background: var(--card); color: var(--accent);
    font-weight: 800; cursor: pointer;
    font-family: inherit;
    font-size: .92rem; min-height: 48px;
}
.tab.active { background: var(--grad); color: #fff; border-color: transparent; }
.detail-panel {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 18px; margin-bottom: 16px;
}
.detail-title { font-size: 1.15rem; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.detail-subtitle {
    font-size: .8rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px;
}
.order-btn {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; width: 100%; padding: 16px 18px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border-strong);
    background: var(--card); color: var(--text);
    text-align: left; cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px; min-height: 76px;
}
.order-btn:disabled { opacity: .45; cursor: not-allowed; }
.order-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.order-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 1.3rem; flex-shrink: 0;
}
.order-text { min-width: 0; }
.order-name { font-weight: 800; font-size: 1rem; margin-bottom: 3px; }
.order-desc { font-size: .8rem; color: var(--muted); line-height: 1.4; }
.order-cost {
    font-size: .82rem; font-weight: 800;
    color: var(--orange); white-space: nowrap; flex-shrink: 0;
}
.order-cost .energy { color: var(--accent-2); margin-left: 6px; }
.advisor-card {
    display: flex; align-items: center; gap: 14px;
    padding: 16px; background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
}
.advisor-card.hired {
    border-color: var(--green);
    background: linear-gradient(135deg, rgba(22,163,74,.06), var(--card));
}
.advisor-card.removed { opacity: .55; border-color: var(--red); }
.advisor-photo {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-2);
    display: grid; place-items: center;
    font-size: 1.6rem; flex-shrink: 0;
    border: 2px solid var(--border); font-weight: 900;
    overflow: hidden;
}
.advisor-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.advisor-info { flex: 1; min-width: 0; }
.advisor-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 2px; }
.advisor-role { font-size: .8rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.advisor-desc { font-size: .82rem; color: var(--muted); line-height: 1.45; }
.btn-hire {
    padding: 12px 18px; border-radius: 999px; border: none;
    background: var(--grad); color: #fff;
    font-weight: 800; font-family: inherit;
    cursor: pointer;
    font-size: .9rem; min-height: 48px; white-space: nowrap;
}
.btn-hire:disabled { opacity: .5; cursor: not-allowed; }
.btn-hire.hired { background: var(--green); }
.chronicle-item {
    display: flex; gap: 10px; padding: 10px 12px;
    background: var(--card);
    border: 2px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 10px; margin-bottom: 8px; font-size: .9rem;
}
.chronicle-item.good { border-left-color: var(--green); }
.chronicle-item.bad { border-left-color: var(--red); }
.chronicle-item.news { border-left-color: var(--orange); background: linear-gradient(90deg, rgba(217,119,6,.06), var(--card)); }
.chronicle-item.court { border-left-color: var(--purple); background: linear-gradient(90deg, rgba(142,68,173,.06), var(--card)); }
.chronicle-day { font-weight: 800; color: var(--accent-2); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.chronicle-text { color: var(--muted); line-height: 1.4; }
.btn-primary {
    width: 100%; padding: 16px; border-radius: 999px;
    border: none; background: var(--grad); color: #fff;
    font-size: 1.05rem; font-weight: 800;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 20px rgba(0,102,204,.3);
    min-height: 56px; letter-spacing: 1px; text-transform: uppercase;
}
.btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,15,30,.75);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 18px;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 24px; max-width: 520px; width: 100%;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
}
.modal.court { border-color: var(--purple); }
.event-photo {
    width: 100%; height: 180px;
    border-radius: 12px; overflow: hidden;
    margin-bottom: 16px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--border);
}
.event-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.event-photo-placeholder { font-size: 3.5rem; color: var(--accent); opacity: .7; }
.modal-title {
    font-size: 1.3rem; font-weight: 800;
    color: var(--accent-2); margin-bottom: 8px;
    text-align: center; letter-spacing: .5px; text-transform: uppercase;
}
.modal-eyebrow {
    text-align: center; font-size: .78rem;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 16px;
}
.modal-body {
    font-size: 1rem; line-height: 1.6;
    color: var(--text); margin-bottom: 20px;
}
.modal-body strong { color: var(--accent); font-weight: 800; }
.modal-body em { color: var(--accent-2); font-style: normal; font-weight: 700; }
.modal-body p { margin-bottom: 10px; }
.modal-body p:last-child { margin-bottom: 0; }
.modal-body .citation {
    border-left: 4px solid var(--accent-2);
    padding: 10px 16px; background: var(--accent-soft);
    border-radius: 8px; margin: 12px 0;
    font-style: italic; color: var(--muted);
}
.modal-body .effect-block {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 14px 16px;
    margin-top: 14px;
    border-left: 4px solid var(--accent);
}
.modal-body .effect-block h4 {
    font-size: .82rem; font-weight: 800;
    color: var(--accent); margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: 1px;
}
.modal-body .effect-block .effect-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: .92rem;
    font-weight: 600;
}
.modal-body .effect-block .effect-row .pos { color: var(--green); font-weight: 800; }
.modal-body .effect-block .effect-row .neg { color: var(--red); font-weight: 800; }
.modal-body .effect-block .effect-row .neutral { color: var(--muted); font-weight: 800; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.answer-btn {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px; background: var(--card);
    border: 2px solid var(--border-strong);
    border-left: 6px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--text); font-family: inherit;
    font-size: 1rem; font-weight: 700;
    text-align: left; cursor: pointer;
    min-height: 68px;
}
.answer-marker {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-weight: 900; font-size: 1.1rem; flex-shrink: 0;
}
.answer-text { flex: 1; min-width: 0; }
.answer-label { display: block; font-weight: 800; margin-bottom: 3px; }
.answer-effect { display: block; font-size: .82rem; color: var(--muted); font-weight: 600; }
.answer-btn.danger { border-left-color: var(--red); }
.answer-btn.danger .answer-marker { background: var(--red); }
.answer-btn.success { border-left-color: var(--green); }
.answer-btn.success .answer-marker { background: var(--green); }
.answer-btn.court { border-left-color: var(--purple); }
.answer-btn.court .answer-marker { background: var(--purple); }
.brief {
    max-width: 620px; margin: 0 auto;
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 28px 22px;
    box-shadow: var(--shadow-lg);
}
.brief-head {
    text-align: center; padding-bottom: 20px;
    margin-bottom: 20px; border-bottom: 2px dashed var(--border);
}
.brief-flag {
    width: 80px; height: 80px; border-radius: 20px;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #fff; font-size: 1.4rem;
    border: 3px solid var(--border-strong);
    overflow: hidden;
}
.brief-flag img {
    width: 100%; height: 100%;
    object-fit: cover; padding: 0; display: block;
}
.brief-title { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 4px; }
.brief-sub { color: var(--muted); font-size: .92rem; }
.brief-body { line-height: 1.7; color: var(--text); margin-bottom: 20px; }
.brief-body p { margin-bottom: 12px; }
.brief-body p:last-child { margin-bottom: 0; }
.brief-sign { text-align: right; color: var(--accent-2); font-style: italic; font-weight: 700; margin-top: 14px; }
.target-picker {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px; margin: 14px 0;
}
.target-btn {
    padding: 14px 12px; background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: 12px; color: var(--text);
    font-family: inherit; font-size: .9rem; font-weight: 800;
    cursor: pointer; min-height: 56px;
}
.target-btn.active { background: var(--grad); color: #fff; border-color: transparent; }
.rank-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; background: var(--accent-soft);
    border-radius: 10px; margin-bottom: 8px; font-size: .95rem;
}
.rank-row.me { background: var(--grad); color: #fff; font-weight: 800; }
.rank-pos { font-weight: 900; color: var(--accent-2); min-width: 26px; }
.rank-row.me .rank-pos { color: #fff; }
.rank-name { flex: 1; font-weight: 700; }
.rank-pct { font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
.rank-row.me .rank-pct { color: #fff; }
.party-info-block {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
}
.party-info-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 16px; padding-bottom: 16px;
    border-bottom: 2px dashed var(--border);
}
.party-info-flag {
    width: 72px; height: 72px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 900; font-size: 1.3rem;
    flex-shrink: 0; border: 2px solid var(--border);
    overflow: hidden;
}
.party-info-flag img {
    width: 100%; height: 100%;
    object-fit: contain; padding: 6px; display: block;
}
.party-info-title h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
.party-info-title .party-style { font-size: .85rem; color: var(--muted); }
.party-info-row {
    display: flex; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
    font-size: .92rem;
}
.party-info-row:last-child { border-bottom: none; }
.party-info-label { color: var(--muted); font-weight: 700; }
.party-info-value { color: var(--text); font-weight: 800; }
.party-info-desc {
    margin-top: 12px; padding-top: 12px;
    border-top: 2px dashed var(--border);
    font-size: .92rem; color: var(--muted); line-height: 1.6;
}
.party-info-advisors {
    margin-top: 16px; padding-top: 16px;
    border-top: 2px dashed var(--border);
}
.party-info-advisors h4 {
    font-size: .95rem; font-weight: 800;
    color: var(--accent); margin-bottom: 10px;
}
.advisor-mini {
    display: flex; gap: 10px; padding: 10px 12px;
    background: var(--accent-soft);
    border-radius: 10px; margin-bottom: 8px; align-items: center;
}
.advisor-mini-photo {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--card); display: grid; place-items: center;
    color: var(--accent-2); font-weight: 900; font-size: 1rem; flex-shrink: 0;
    overflow: hidden;
}
.advisor-mini-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.advisor-mini-info { flex: 1; min-width: 0; }
.advisor-mini-name { font-weight: 800; font-size: .9rem; }
.advisor-mini-role { font-size: .78rem; color: var(--muted); }
.no-advisors-note {
    padding: 12px; background: var(--accent-soft);
    border-radius: 10px; font-size: .85rem; color: var(--muted);
    text-align: center; font-style: italic;
}
.kompromat-block { margin-top: 12px; padding-top: 12px; border-top: 2px dashed var(--border); }
.kompromat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: var(--accent-soft);
    border-radius: 10px; margin-bottom: 6px; font-size: .85rem;
}
.kompromat-name { font-weight: 700; }
.kompromat-count { font-weight: 900; color: var(--purple); font-variant-numeric: tabular-nums; }
.kompromat-empty {
    padding: 12px; text-align: center;
    background: var(--accent-soft); border-radius: 10px;
    font-size: .82rem; color: var(--muted); font-style: italic;
}
#screen-counting {
    position: fixed; inset: 0; background: var(--bg);
    z-index: 9999; display: none; flex-direction: column;
    padding: 20px; overflow: hidden;
}
#screen-counting.active { display: flex; }
.count-head { text-align: center; padding: 20px 0 10px; }
.count-head h2 {
    font-size: clamp(1.3rem, 4vw, 1.9rem); font-weight: 800;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}
.count-head p { color: var(--muted); font-size: .95rem; }
.count-timer {
    text-align: center; font-size: 2rem; font-weight: 900;
    color: var(--accent); font-variant-numeric: tabular-nums;
    margin: 6px 0 12px; letter-spacing: 2px;
}
.count-progress-bar {
    height: 10px; background: var(--accent-soft);
    border-radius: 999px; overflow: hidden;
    margin: 0 auto 24px; max-width: 500px; width: 100%;
}
.count-progress-fill {
    height: 100%; width: 0%;
    background: var(--grad);
    border-radius: 999px;
}
.count-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; max-width: 700px; margin: 0 auto 20px; width: 100%;
}
.count-stat {
    background: var(--card); border: 2px solid var(--border-strong);
    border-radius: var(--radius-sm); padding: 12px; text-align: center;
}
.count-stat-label {
    font-size: .72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
}
.count-stat-value {
    font-size: 1.4rem; font-weight: 900;
    color: var(--accent); font-variant-numeric: tabular-nums;
}
.count-stat-value.green { color: var(--green); }
.count-candidates {
    max-width: 700px; margin: 0 auto; width: 100%;
    display: flex; flex-direction: column; gap: 10px;
    flex: 1; overflow-y: auto; padding-bottom: 20px;
}
.count-candidate {
    background: var(--card); border: 2px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
}
.count-candidate.me {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,102,204,.15);
}
.count-candidate-head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 6px; gap: 8px;
}
.count-candidate-name {
    font-weight: 800; font-size: .95rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.count-candidate-pct {
    font-weight: 900; font-variant-numeric: tabular-nums;
    font-size: 1rem; color: var(--accent); flex-shrink: 0;
}
.count-candidate-bar {
    height: 8px; background: var(--accent-soft);
    border-radius: 999px; overflow: hidden;
}
.count-candidate-fill {
    height: 100%; border-radius: 999px;
    width: 0%;
}
.count-ticker {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card);
    border-top: 2px solid var(--border-strong);
    padding: 10px 16px; font-size: .85rem;
    color: var(--muted); text-align: center; font-weight: 700;
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
}
.count-ticker b { color: var(--accent); font-variant-numeric: tabular-nums; }
.bulletin-anim {
    position: fixed; bottom: 70px; right: 20px;
    font-size: 1.5rem; z-index: 10001;
    pointer-events: none;
    animation: flyUp 1.2s ease-out forwards;
}
.brief-body,
.modal-body,
.advisor-desc,
.party-desc,
.party-info-desc {
    white-space: pre-line;
}
.brief-body p {
    margin-bottom: 14px;
    line-height: 1.75;
}
.brief-body p:last-child {
    margin-bottom: 0;
}
@keyframes flyUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-180px) scale(.4); }
}
@media (max-width: 640px) {
    .container { padding: 14px; }
    .party-card { flex-direction: column; text-align: center; }
    .party-stats { text-align: center; }
    .hud { grid-template-columns: repeat(2, 1fr); }
    .modal { padding: 20px 16px; }
    .modal-title { font-size: 1.1rem; }
    .answer-btn { padding: 14px; font-size: .95rem; min-height: 64px; }
    .answer-marker { width: 36px; height: 36px; font-size: 1rem; }
    .count-timer { font-size: 1.6rem; }
    .count-stat-value { font-size: 1.2rem; }
    .region-party-row { grid-template-columns: 80px 1fr 40px; font-size: .75rem; }
}
</style>

function getEventPhotoHtml(eventId) {
    const photo = (typeof eventPhotos !== 'undefined' && (eventPhotos[eventId] || eventPhotos['default'])) || null;
    if (photo) {
        return `<div class="event-photo"><img src="${photo}" alt="Событие" onerror="this.parentNode.innerHTML='<div class=\\'event-photo-placeholder\\'>📰</div>'"></div>`;
    }
    return `<div class="event-photo"><div class="event-photo-placeholder">📰</div></div>`;
}

function getAdvisorPhotoHtml(advisor) {
    const photo = (typeof advisorPhotos !== 'undefined') ? advisorPhotos[advisor.id] : null;
    const initial = advisor.name.charAt(0);
    if (photo) {
        return `<img src="${photo}" alt="${advisor.name}" onerror="this.parentNode.innerHTML='${initial}'">`;
    }
    return initial;
}

function getPartyPhotoHtml(party) {
    const photo = (typeof partyPhotos !== 'undefined') ? partyPhotos[party.id] : null;
    if (photo) {
        return `<img src="${photo}" alt="${party.name}" onerror="this.parentNode.innerHTML='${party.flag}'">`;

const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

function addLog(text, type = 'neutral') {
    state.log.unshift({ text, type, day: state.day });
    if (state.log.length > 50) state.log.pop();
    renderLog();
}

function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = $('page-' + name);
    if (el) el.classList.add('active');
    window.scrollTo(0, 0);
}

function setTab(name) {
    state.activeTab = name;
    document.querySelectorAll('.tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === name);
    });
    ['regions', 'orders', 'staff', 'kompromat', 'parties', 'log'].forEach(t => {
        const el = $('tab-' + t);
        if (el) el.style.display = (t === name) ? 'block' : 'none';
    });
}

document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => setTab(tab.dataset.tab));
});

function applyPartyTheme(party) {
    const root = document.documentElement;
    root.style.setProperty('--accent', party.color);
    root.style.setProperty('--accent-2', party.colorBright);
    root.style.setProperty('--accent-soft', party.colorSoft);
    root.style.setProperty('--border-strong', party.color);
    root.style.setProperty('--grad', `linear-gradient(135deg, ${party.color}, ${party.colorBright})`);
}

function renderParties() {
    const list = $('parties-list');
    list.innerHTML = '';
    PARTIES.forEach(p => {
        const card = document.createElement('div');
        card.className = 'party-card';
        card.innerHTML = `

        card.onclick = () => selectParty(p);

function selectParty(p) {
    state.party = p;
    state.money = Math.round(1_000_000 * (p.id === 'er' ? 2 : p.id === 'kprf' ? 0.8 : 1));
    state.trust = p.traits.trustStart;
    state.opponents = PARTIES.filter(x => x.id !== p.id).map(x => ({ ...x }));
    state.advisors = [];
    state.bondarenkoActions = 0;
    state.bondarenkoRemoved = false;
    state.yablokoRemoved = false;
    state.day = 1;
    state.phase = 'campaign';
    state.fraudPoints = 0;
    state.kompromat = {};
    state.nextSueDay = Math.floor(rand(5, 12));
    state.suedToday = false;
    state.opponentAdvisors = {};
    state.opponents.forEach(o => { state.opponentAdvisors[o.id] = []; });

    applyPartyTheme(p);

    $('brief-flag').innerHTML = getPartyPhotoHtml(p);
    $('brief-flag').style.background = `linear-gradient(135deg,${p.colorDark},${p.color})`;
    $('brief-title').textContent = p.name;
    $('brief-sub').textContent = `Лидер: ${p.leader} · ${p.style}`;
    $('brief-body').innerHTML = p.welcome.map(t => `<p>${t}</p>`).join('') +
        `<p class="brief-sign">— ${p.leader}</p>`;

    showPage('brief');

   ============================================ */
function getForecast() {
    let totalWeight = 0, sum = 0;
    MACRO_REGIONS.forEach(r => {
        const rating = getFinalRating(r.code);
        sum += rating * r.weight;
        totalWeight += r.weight;
    });
    const avg = totalWeight ? sum / totalWeight : 0;
    const errorBase = 1 + Math.abs(state.trust - 50) * 0.06;
    const error = clamp(errorBase, 1, 8);
    return { avg, error };
}

function getTrustDailyEffect() {
    return (state.trust - 50) * 0.08;
}

function renderHUD() {
    const forecast = getForecast();
    const trustEffect = getTrustDailyEffect();
    const hud = $('hud');
    const isElection = state.phase === 'election';
    const maxDays = isElection ? state.maxElectionDays : state.maxCampaignDays;

    const trustEffectText = (trustEffect >= 0 ? '+' : '') + trustEffect.toFixed(2) + '%/день';
    const trustEffectClass = trustEffect >= 0 ? 'pos' : 'neg';

    const trustValue = Math.round(state.trust);
    const trustColorClass = trustValue >= 50 ? 'good' : (trustValue >= 0 ? '' : 'danger');

    let fraudBlock = '';
    if (state.party.id === 'er') {
        const fraudBonus = state.fraudPoints * 0.8;
        fraudBlock = `
            <div class="hud-item special">
                <div class="hud-icon">🎭</div>
                <div class="hud-value">${state.fraudPoints}</div>
                <div class="hud-label">Фальсиф.</div>
                <div class="hud-sub pos">+${fraudBonus.toFixed(1)}%</div>

function initRegions() {
    MACRO_REGIONS.forEach(r => {
        const base = state.party.base + rand(-2, 2);
        const myRating = clamp(base, 2, 60);
        const opps = {};
        state.opponents.forEach(o => {
            opps[o.id] = clamp(o.base + rand(-2, 2), 1, 55);
        });
        state.regions[r.code] = { myRating, opps, delta: 0 };
        normalizeRegion(r.code);
    });
}

function normalizeRegion(code) {
    const data = state.regions[code];
    let sum = data.myRating;
    Object.keys(data.opps).forEach(id => { sum += data.opps[id]; });
    if (sum <= 0) return;
    data.myRating = (data.myRating / sum) * 100;
    Object.keys(data.opps).forEach(id => {
        data.opps[id] = (data.opps[id] / sum) * 100;
    });
}

function getFinalRating(code) {
    const base = state.regions[code].myRating;
    const trustBonus = (state.trust - 50) * 0.12;
    return clamp(base + trustBonus, 0, 100);
}

function renderRegions() {
    const grid = $('regions-grid');
    grid.innerHTML = '';
    MACRO_REGIONS.forEach(r => {
        const data = state.regions[r.code];
        const myRating = getFinalRating(r.code);
        const owned = myRating > 50;

        const others = state.opponents.map(o => ({
            name: o.name,
            rating: data.opps[o.id] || 0,
            color: o.color,
            isMe: false
        }));
        const me = { name: state.party.name, rating: myRating, color: state.party.color, isMe: true };
        const allPlayers = [me, ...others];

        const total = allPlayers.reduce((s, p) => s + p.rating, 0);
        if (total > 0) {
            allPlayers.forEach(p => { p.rating = (p.rating / total) * 100; });
        }
        allPlayers.sort((a, b) => b.rating - a.rating);

        const card = document.createElement('div');
        card.className = 'region-card' + (owned ? ' owned' : '');
        card.innerHTML = `
            <div class="region-header">
                <div class="region-name">${r.name}</div>
                <div class="region-weight">вес ${r.weight}</div>
            </div>
            <div class="region-parties">
                ${allPlayers.map(p => `
                    <div class="region-party-row ${p.isMe ? 'me' : ''}">
                        <span class="region-party-name" style="color:${p.color}">${p.name}</span>
                        <div class="region-party-bar">
                            <div class="region-party-fill" style="width:${p.rating}%;background:${p.color}"></div>
                        </div>
                        <span class="region-party-pct" style="color:${p.color}">${p.rating.toFixed(1)}%</span>
                    </div>
                `).join('')}
            </div>
            <div class="region-tags">
                ${r.tags.map(t => `<span class="region-tag">${t}</span>`).join('')}
                ${owned ? '<span class="region-tag" style="background:rgba(22,163,74,.15);color:var(--green)">✓ наш</span>' : ''}
            </div>
        `;
        grid.appendChild(card);
    });
}

function getAvailableOrders() {
    const available = [...BASE_ORDERS];
    state.advisors.forEach(adv => {
        if (adv.unlock && ADVISOR_ORDERS[adv.unlock] && !adv.removed) {
            available.push(ADVISOR_ORDERS[adv.unlock]);
        }
    });
    // Игрок за ЕР НЕ получает бесплатный приказ на фальсификацию.
    return available;
}

function renderOrders() {
    const list = $('orders-list');
    list.innerHTML = '';
    const available = getAvailableOrders();
    available.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'order-btn';
        const costText = o.money === 0 ? 'бесплатно'
            : o.money > 0 ? `−${(o.money / 1000).toFixed(0)}к`
            : `+${Math.abs(o.money / 1000).toFixed(0)}к`;
        const cd = state.cooldowns[o.id] || 0;
        const cdText = cd > 0 ? ` ⏳${cd}` : '';

        btn.innerHTML = `
            <div class="order-left">
                <div class="order-icon">${o.icon}</div>
                <div class="order-text">
                    <div class="order-name">${o.name}</div>
                    <div class="order-desc">${o.desc}</div>
                </div>
            </div>
            <div class="order-cost">💰${costText}<span class="energy">⚡${o.ap}${cdText}</span></div>
        `;

        const noMoney = o.money > 0 && state.money < o.money;
        const noAP = state.actionPoints < o.ap;
        btn.disabled = state.finished || noMoney || noAP || cd > 0;
        btn.onclick = () => doOrder(o);
        list.appendChild(btn);
    });
}

function doOrder(o) {
    if (state.finished) return;
    const cd = state.cooldowns[o.id] || 0;

    if (o.money > 0 && state.money < o.money) return;
    if (state.actionPoints < o.ap) return;
    if (cd > 0) return;

    if (o.id === 'sue') {
        openSuePicker(() => {
            state.money -= o.money;
            state.actionPoints -= o.ap;
            if (o.cd) state.cooldowns[o.id] = o.cd;
            renderAll();
        });
        return;
    }
    if (o.id === 'dig') {
        openDigPicker(() => {
            state.money -= o.money;
            state.actionPoints -= o.ap;
            if (o.cd) state.cooldowns[o.id] = o.cd;
            renderAll();
        });
        return;
    }
    if (o.id === 'debate') {
        state.money -= o.money;
        state.actionPoints -= o.ap;
        if (o.cd) state.cooldowns[o.id] = o.cd;
        renderAll();
        startDebate();
        return;
    }

    state.money -= o.money;
    state.actionPoints -= o.ap;
    const result = o.run();
    if (o.cd) state.cooldowns[o.id] = o.cd;
    renderAll();

    if (result) {
        showActionResult(o, result);
    }
}

function showActionResult(order, result) {
    const rows = [];
    if (result.trust !== undefined && result.trust !== 0) {
        rows.push(`
            <div class="effect-row">
                <span>Доверие</span>
                <span class="${result.trust > 0 ? 'pos' : 'neg'}">${result.trust > 0 ? '+' : ''}${result.trust}%</span>
            </div>
        `);
    }
    if (result.fraud !== undefined && result.fraud !== 0) {
        rows.push(`
            <div class="effect-row">
                <span>Очки фальсификации</span>
                <span class="${result.fraud > 0 ? 'pos' : 'neg'}">${result.fraud > 0 ? '+' : ''}${result.fraud}</span>
            </div>
        `);
    }
    if (result.allRegions) {
        rows.push(`
            <div class="effect-row">
                <span>Все регионы</span>
                <span class="pos">+${result.regionBoost}%</span>
            </div>
        `);
    } else if (result.regions && result.regions.length > 0) {
        rows.push(`
            <div class="effect-row">
                <span>Регионы (${result.regions.length})</span>
                <span class="pos">+${result.regionBoost}%</span>
            </div>
        `);
        result.regions.forEach(name => {
            rows.push(`
                <div class="effect-row" style="font-size:.82rem;color:var(--muted)">
                    <span>• ${name}</span>
                    <span class="pos">+${result.regionBoost}%</span>
                </div>
            `);
        });
    }

    const body = `
        <p>Приказ выполнен: <strong>${order.name}</strong></p>
        <div class="effect-block">
            <h4>Результат</h4>
            ${rows.length ? rows.join('') : '<div class="effect-row"><span>Без изменений</span><span class="neutral">—</span></div>'}
        </div>
    `;

    showModal({
        type: 'success',
        eyebrow: 'Приказ выполнен',
        title: order.name,
        body,
        answers: [
            { letter: '✓', label: 'Принято', effect: 'Продолжаем', variant: 'success', action: () => {} }
        ]
    });
}

function openDigPicker(onConfirm) {
    let selectedId = state.opponents[0]?.id;
    const buildTargets = () => state.opponents.map(o => {
        const existing = state.kompromat[o.id] || 0;
        return `
            <button class="target-btn ${o.id === selectedId ? 'active' : ''}" data-id="${o.id}"
                    style="border-color:${o.color}">
                ${o.name}${existing > 0 ? ` (${existing})` : ''}
            </button>
        `;
    }).join('');

    showModal({
        type: 'info',
        eyebrow: 'Разведка · Компромат',
        title: 'На кого копаем?',
        body: `
            <p>Нарыть компромат на партию. Используется в суде.</p>
            <p style="font-size:.9rem;color:var(--muted)">Стоит <strong>60 000 ₽</strong> и <strong>1 действие</strong>.</p>
            <div class="target-picker" id="dig-targets">${buildTargets()}</div>
        `,
        answers: [
            {
                letter: '✓', label: 'Нарыть компромат', effect: '−60к, +1 компромат',
                variant: 'success',
                action: () => {
                    if (!selectedId) return;
                    const target = state.opponents.find(o => o.id === selectedId);
                    state.kompromat[selectedId] = (state.kompromat[selectedId] || 0) + 1;
                    addLog(`Компромат на «${target.name}» (${state.kompromat[selectedId]})`, 'good');
                    if (onConfirm) onConfirm();
                    renderAll();
                    showModal({
                        type: 'success',
                        eyebrow: 'Разведка',
                        title: 'Компромат добыт',
                        body: `
                            <p>Вы нарыли компромат на «<strong>${target.name}</strong>».</p>
                            <div class="effect-block">
                                <h4>Результат</h4>
                                <div class="effect-row">
                                    <span>Папка компромата</span>
                                    <span class="pos">+1 (всего ${state.kompromat[selectedId]})</span>
                                </div>
                            </div>
                        `,
                        answers: [{ letter: '✓', label: 'Отлично', variant: 'success', action: () => {} }]
                    });
                }
            },
            { letter: '✕', label: 'Отменить', effect: 'Ничего не тратим', action: () => {} }
        ]
    });

    setTimeout(() => {
        const picker = $('dig-targets');
        if (!picker) return;
        picker.addEventListener('click', e => {
            const btn = e.target.closest('.target-btn');
            if (!btn) return;
            selectedId = btn.dataset.id;
            picker.querySelectorAll('.target-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.id === selectedId);
            });
        });
    }, 50);
}

    const buildTargets = () => targets.map(o => `

    });

function startDebate() {
    let best = null, bestSum = 0;
    state.opponents.forEach(o => {
        let s = 0;
        MACRO_REGIONS.forEach(r => s += (state.regions[r.code].opps[o.id] || 0));
        if (s > bestSum) { bestSum = s; best = o; }
    });
    if (!best) return;

    const successChance = clamp(0.4 + state.trust / 200, 0.15, 0.85);
    const success = Math.random() < successChance;

    showModal({
        type: 'debate',
        eyebrow: 'Федеральные дебаты',
        title: success ? 'Победа в дебатах' : 'Поражение в дебатах',
        eventId: 'debate',
        body: `

            <div class="citation">
                ${pick([
                    '«Мы не обещаем золотых гор. Мы обещаем работу.»',
                    '«Пока оппоненты делят портфели, мы работаем для людей.»',
                    '«Я не политик. Я управленец.»'
                ])}
            </div>
        `,
        answers: [
            {
                letter: '✓', label: 'Принять результат',
                effect: success ? '+4% доверия' : '−6% доверия',
                variant: success ? 'success' : 'danger',
                action: () => {
                    if (success) {
                        state.trust = clamp(state.trust + 4, -50, 100);
                        MACRO_REGIONS.forEach(r => {
                            state.opponents.forEach(o => {
                                if (state.regions[r.code].opps[o.id] !== undefined) {
                                    state.regions[r.code].opps[o.id] = clamp(state.regions[r.code].opps[o.id] - 1, 0, 100);
                                }
                            });
                            normalizeRegion(r.code);
                        });
                        addLog(`Дебаты: победа над «${best.name}»`, 'good');

                    renderAll();
                    showModal({

        ]
    });
}

function checkYablokoRemoval() {
    if (state.yablokoRemoved) return;
    if (state.party.id === 'yabloko') return;

    const yabloko = state.opponents.find(o => o.id === 'yabloko');
    if (!yabloko) return;

    let totalWeight = 0, sum = 0;
    MACRO_REGIONS.forEach(r => {
        const rating = state.regions[r.code].opps['yabloko'] || 0;
        sum += rating * r.weight;
        totalWeight += r.weight;
    });
    const avg = totalWeight ? sum / totalWeight : 0;

    if (avg > 20 && Math.random() < 0.5) {
        state.yablokoRemoved = true;
        showModal({
            type: 'scandal',

function renderLog() {
    const box = $('log-list');
    if (!state.log.length) {
        box.innerHTML = `<div class="chronicle-item"><div class="chronicle-text" style="color:var(--muted)">Кампания начинается...</div></div>`;
        return;
    }
    box.innerHTML = state.log.slice(0, 40).map(e => `
        <div class="chronicle-item ${e.type}">
            <div class="chronicle-day">Д${e.day}</div>
            <div class="chronicle-text">${e.text}</div>
        </div>
    `).join('');
}

function showModal({ type, eyebrow, title, body, answers, eventId }) {
    const modal = $('modal');
    const colorMap = {
        scandal: 'var(--red)',
        success: 'var(--green)',
        economy: 'var(--orange)',
        info: 'var(--accent)',
        debate: 'var(--purple)',
        news: 'var(--orange)',
        court: 'var(--purple)',
    };
    $('modal-title').style.color = colorMap[type] || 'var(--accent-2)';
    $('modal-eyebrow').textContent = eyebrow || '';
    $('modal-title').textContent = title;
    $('modal-body').innerHTML = body;
    modal.className = 'modal' + ((type === 'court' || title.includes('иск')) ? ' court' : '');

    const photoContainer = $('modal-photo-container');
    if (eventId) {
        photoContainer.innerHTML = getEventPhotoHtml(eventId);
    } else {
        photoContainer.innerHTML = '';
    }

    const answersBox = $('modal-answers');
    answersBox.innerHTML = '';
    answers.forEach((a, i) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn' + (a.variant ? ' ' + a.variant : '');
        const letter = a.letter || String.fromCharCode(65 + i);
        btn.innerHTML = `
            <div class="answer-marker">${letter}</div>
            <div class="answer-text">
                <span class="answer-label">${a.label}</span>
                ${a.effect ? `<span class="answer-effect">${a.effect}</span>` : ''}
            </div>
        `;
        btn.onclick = () => {
            closeModal();
            if (a.action) a.action();
        };
        answersBox.appendChild(btn);
    });

    $('modal-overlay').classList.add('active');
    if (navigator.vibrate) navigator.vibrate(15);
}

function closeModal() {
    $('modal-overlay').classList.remove('active');
}

                      title: 'Резкий ответ',
                      body: `<div class="effect-block"><h4>Результат</h4>
                          <div class="effect-row"><span>• ${regionName}</span><span class="pos">+5%</span></div>
                          <div class="effect-row"><span>Доверие</span><span class="neg">−5%</span></div></div>`,
                      answers: [{ letter: '✓', label: 'Ок', action: () => {} }]
                  });
              } }
        ]
    },
];

function rollDayEvent() {
    if (Math.random() < 0.5) {
        const available = SECONDARY_NEWS.filter(isNewsAvailable);
        if (available.length) {
            const newsItem = pick(available);
            const newsText = newsItem.text;
            const eventId = newsItem.eventId;
            addLog(newsText, 'news');

            const lower = newsText.toLowerCase();
            const important = IMPORTANT_NEWS_KEYWORDS.some(kw => lower.includes(kw.toLowerCase()));

            if (important && Math.random() < 0.75) {
                showModal({
                    type: 'news',
                    eyebrow: 'Срочно в номер',
                    title: 'Новости кампании',
                    eventId: eventId,
                    body: `<p>${newsText}</p><p style="color:var(--muted);font-size:.9rem">Как реагируем?</p>`,
                    answers: [
                        { letter: 'A', label: '📰 Принять к сведению', effect: 'Ничего',
                          action: () => { renderAll(); } },
                        { letter: 'B', label: '📢 Осудить публично', effect: '+2% доверия',
                          action: () => {
                              state.trust = clamp(state.trust + 2, -50, 100);
                              addLog('Выступили с осуждением.', 'neutral');
                              renderAll();
                              showModal({
                                  type: 'success',
                                  eyebrow: 'Результат',
                                  title: 'Публичное осуждение',
                                  body: `<div class="effect-block"><h4>Результат</h4>
                                      <div class="effect-row"><span>Доверие</span><span class="pos">+2%</span></div></div>`,
                                  answers: [{ letter: '✓', label: 'Ок', variant: 'success', action: () => {} }]
                              });
                          } },
                        { letter: 'C', label: '🕵️ Использовать в свою пользу', effect: '+2% в регионе, −2% доверия', variant: 'danger',
                          action: () => {
                              const code = pick(['WEST', 'CENTER', 'SOUTH', 'EAST']);
                              const regionName = MACRO_REGIONS.find(r => r.code === code)?.name || code;
                              state.regions[code].myRating = clamp(state.regions[code].myRating + 2, 0, 100);
                              normalizeRegion(code);
                              state.trust = clamp(state.trust - 2, -50, 100);
                              addLog('Использовали событие.', 'good');
                              renderAll();
                              showModal({
                                  type: 'success',
                                  eyebrow: 'Результат',
                                  title: 'Использовали в свою пользу',
                                  body: `<div class="effect-block"><h4>Результат</h4>
                                      <div class="effect-row"><span>• ${regionName}</span><span class="pos">+2%</span></div>
                                      <div class="effect-row"><span>Доверие</span><span class="neg">−2%</span></div></div>`,
                                  answers: [{ letter: '✓', label: 'Ок', variant: 'success', action: () => {} }]
                              });
                          } }
                    ]
                });
                return;
            }
        }
    }

    if (Math.random() > 0.35) return;
    if (state.lastEventDay === state.day) return;
    state.lastEventDay = state.day;

    if (state.bondarenkoActions >= 3 && !state.bondarenkoRemoved && state.party.id === 'kprf') {
        triggerBondarenkoRemoval();
        return;
    }

    if (state.day === state.nextSueDay && !state.suedToday) {
        state.suedToday = true;
        triggerSueAgainstPlayer();
        return;
    }

    const available = MAIN_EVENTS.filter(e => !e.condition || e.condition());
    if (!available.length) return;
    const ev = pick(available);

    showModal({
        type: ev.type,
        eyebrow: ev.eyebrow,
        title: ev.title,
        eventId: ev.id,
        body: ev.body(),
        answers: ev.answers()
    });
}

$('btn-next-week').addEventListener('click', () => {
    if (state.finished) return;

    if (state.phase === 'campaign') {
        if (state.day >= state.maxCampaignDays) {
            state.phase = 'election';
            state.day = 1;
            state.actionPoints = state.maxAP;
            renderAll();
            showModal({
                type: 'info',
                eyebrow: 'Начало голосования',
                title: 'День выборов',
                body: `
                    <p>Кампания завершена. Начинаются <strong>${state.maxElectionDays} дня голосования</strong>.</p>
                    ${state.party.id === 'er' ? `<p>Ваши <strong>${state.fraudPoints} очков фальсификации</strong> применятся в конце.</p>` : ''}
                `,
                answers: [{ letter: 'A', label: 'Начать', effect: 'Голосование', action: () => {} }]
            });
            return;
        }
    } else {
        if (state.day >= state.maxElectionDays) { startCounting(); return; }
    }

    state.day++;
    state.actionPoints = state.maxAP;

    Object.keys(state.cooldowns).forEach(k => {
        if (state.cooldowns[k] > 0) state.cooldowns[k]--;
    });

    state.trust = clamp(state.trust - 1, -50, 100);

    state.opponents.forEach(o => {
        const hired = state.opponentAdvisors[o.id] || [];
        const notHired = (o.advisors || []).filter(a => !hired.find(h => h.id === a.id));
        if (hired.length < 3 && notHired.length > 0 && Math.random() < 0.2) {
            const newAdv = pick(notHired);
            hired.push(newAdv);
            state.opponentAdvisors[o.id] = hired;
            addLog(`«${o.name}» наняли советника: ${newAdv.name}`, 'neutral');
        }
        if (Math.random() < 0.08) {
            addLog(`«${o.name}» усилили кампанию`, 'bad');
        }
    });

    applyDayEffects();
    checkYablokoRemoval();
    renderAll();
    rollDayEvent();
});

function applyDayEffects() {
    const trustBonus = getTrustDailyEffect();

    MACRO_REGIONS.forEach(r => {
        const d = state.regions[r.code];
        const prev = d.myRating;
        const noise = rand(-1, 1);
        const delta = trustBonus + noise;
        d.myRating = clamp(d.myRating + delta, 0, 100);
        d.delta = d.myRating - prev;

        state.opponents.forEach(o => {
            if (d.opps[o.id] === undefined) return;
            const isER = o.id === 'er';
            const oppBase = isER ? 1.0 : 0.7;
            const oppNoise = rand(-0.6, 0.6);
            const oppDelta = oppBase + oppNoise;
            d.opps[o.id] = clamp(d.opps[o.id] + oppDelta, 0, 100);
        });

        normalizeRegion(r.code);
    });
}

let countingState = null;

function startCounting() {
    state.finished = true;

    const finalResults = MACRO_REGIONS.map(r => {
        const myRating = getFinalRating(r.code);
        return {
            region: r,
            myRating,
            realMe: clamp(myRating + rand(-3, 3), 0, 100),
        };
    });

    const oppReal = {};
    state.opponents.forEach(o => oppReal[o.id] = 0);
    let totalWeight = 0;
    finalResults.forEach(fr => {
        totalWeight += fr.region.weight;
        state.opponents.forEach(o => {
            if (state.regions[fr.region.code].opps[o.id] !== undefined) {
                oppReal[o.id] += state.regions[fr.region.code].opps[o.id] * fr.region.weight;
            }
        });
    });

    let myFinal = finalResults.reduce((sum, fr) => sum + fr.realMe * fr.region.weight, 0) / totalWeight;

    // ===== ИЗМЕНЕНИЕ: НПС ЕР получает строго +10..15 п.п., без других баффов =====
    if (oppReal['er'] !== undefined) {
        const erFraudBonus = rand(10, 15);
        oppReal['er'] += erFraudBonus * totalWeight;
    }

    // ===== ИЗМЕНЕНИЕ: игрок за ЕР получает только заработанные очки =====
    let fraudBonus = 0;
    if (state.party.id === 'er' && state.fraudPoints > 0) {
        fraudBonus = state.fraudPoints * 0.8;
        myFinal += fraudBonus;
    }

    const trueTargets = [
        { name: state.party.name, color: state.party.color, target: myFinal, isMe: true },
        ...state.opponents.map(o => ({
            name: o.name, color: o.color, target: oppReal[o.id] / totalWeight, isMe: false
        }))
    ];
    const totalTarget = trueTargets.reduce((s, c) => s + c.target, 0);
    trueTargets.forEach(c => { c.target = (c.target / totalTarget) * 100; });

    const startValues = trueTargets.map(c => {
        if (c.isMe) {
            return clamp(c.target * 0.85 + rand(-2, 2), 1, 100);
        }
        const party = PARTIES.find(p => p.name === c.name);
        const base = party ? party.base : 5;
        return clamp(base + rand(-2, 3), 1, 100);
    });
    const startTotal = startValues.reduce((s, v) => s + v, 0);
    const normalizedStarts = startValues.map(v => (v / startTotal) * 100);

    const candidates = trueTargets.map((c, i) => ({
        name: c.name,
        color: c.color,
        isMe: c.isMe,
        target: c.target,
        start: normalizedStarts[i],
        current: normalizedStarts[i],
        speedMultiplier: 0.9 + Math.random() * 0.2,
        phase: Math.random() * Math.PI * 2,
    }));

    countingState = {
        totalSeconds: 45,
        elapsed: 0,
        candidates,
        trueTargets,
        totalBulletins: Math.round(rand(50_000_000, 65_000_000)),
        processedBulletins: 0,
        targetTurnout: rand(55, 68),
        observers: 142,
        violations: 0,
        fraudBonus,
        fraudPoints: state.fraudPoints,
    };

    renderCountingCandidates();
    $('screen-counting').classList.add('active');
    document.body.style.overflow = 'hidden';

    const startTime = Date.now();
    const interval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        countingState.elapsed = elapsed;
        updateCountingFrame(elapsed);

        if (elapsed >= countingState.totalSeconds) {
            clearInterval(interval);
            finishCounting();
        }
    }, 100);
}

function renderCountingCandidates() {
    const box = $('count-candidates');
    box.innerHTML = '';
    countingState.candidates.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'count-candidate' + (c.isMe ? ' me' : '');
        el.innerHTML = `
            <div class="count-candidate-head">
                <div class="count-candidate-name" style="color:${c.color}">${c.name}${c.isMe ? ' (вы)' : ''}</div>
                <div class="count-candidate-pct" style="color:${c.color}" data-pct="${i}">${c.current.toFixed(1)}%</div>
            </div>
            <div class="count-candidate-bar">
                <div class="count-candidate-fill" style="background:${c.color};width:${c.current}%" data-fill="${i}"></div>
            </div>
        `;
        box.appendChild(el);
    });
}

function updateCountingFrame(elapsed) {
    const progress = Math.min(1, elapsed / countingState.totalSeconds);

    const processedPct = Math.min(100, progress * 100);
    $('count-processed').textContent = processedPct.toFixed(1) + '%';
    $('count-progress').style.width = processedPct + '%';

    countingState.processedBulletins = Math.round(countingState.totalBulletins * progress);
    $('count-bulletins').textContent = countingState.processedBulletins.toLocaleString('ru-RU');

    const turnout = Math.round(countingState.targetTurnout * progress * 10) / 10;
    $('count-turnout').textContent = turnout.toFixed(1) + '%';

    const remaining = Math.max(0, Math.ceil(countingState.totalSeconds - elapsed));
    const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
    const ss = String(remaining % 60).padStart(2, '0');
    $('count-timer').textContent = `${mm}:${ss}`;

    countingState.candidates.forEach((c) => {
        const myProgress = Math.max(0, Math.min(1, progress * c.speedMultiplier));
        const wobble = Math.sin(elapsed * 1.5 + c.phase) * 0.6 * (1 - progress);
        c.current = Math.max(0, c.start + (c.target - c.start) * myProgress + wobble);
    });

    const totalCurrent = countingState.candidates.reduce((sum, c) => sum + c.current, 0);
    if (totalCurrent > 0) {
        countingState.candidates.forEach(c => {
            c.current = (c.current / totalCurrent) * 100;
        });
    }

    countingState.candidates.forEach((c, i) => {
        const pctEl = document.querySelector(`[data-pct="${i}"]`);
        const fillEl = document.querySelector(`[data-fill="${i}"]`);
        if (pctEl) pctEl.textContent = c.current.toFixed(1) + '%';
        if (fillEl) fillEl.style.width = Math.min(100, c.current) + '%';
    });

    if (Math.random() < 0.15 && progress < 0.85) {
        countingState.violations += Math.random() < 0.3 ? 1 : 0;
        $('count-violations').textContent = countingState.violations;
    }

    if (Math.random() < 0.08) {
        const bulletin = document.createElement('div');
        bulletin.className = 'bulletin-anim';
        bulletin.textContent = pick(['🗳️', '📄', '✓']);
        document.body.appendChild(bulletin);
        setTimeout(() => bulletin.remove(), 1300);
    }

    const messages = [
        'Обработка бюллетеней...',
        'Проверка подписей...',
        'Сверка с протоколами...',
        'Подсчёт по участкам...',
        'Проверка нарушений...',
        'Финальная сверка...',
    ];
    const msgIndex = Math.min(messages.length - 1, Math.floor(progress * messages.length));
    $('count-status').textContent = messages[msgIndex];
}

function finishCounting() {
    countingState.candidates.forEach((c, i) => {
        c.current = c.target;
        const pctEl = document.querySelector(`[data-pct="${i}"]`);
        const fillEl = document.querySelector(`[data-fill="${i}"]`);
        if (pctEl) pctEl.textContent = c.target.toFixed(2) + '%';
        if (fillEl) fillEl.style.width = Math.min(100, c.target) + '%';
    });

    countingState.trueTargets = countingState.candidates.map(c => ({
        name: c.name,
        color: c.color,
        target: c.target,
        isMe: c.isMe,
    }));

    $('count-processed').textContent = '100%';
    $('count-progress').style.width = '100%';
    $('count-bulletins').textContent = countingState.totalBulletins.toLocaleString('ru-RU');
    $('count-turnout').textContent = countingState.targetTurnout.toFixed(1) + '%';
    $('count-status').textContent = 'Подсчёт завершён!';

    setTimeout(showElectionResults, 800);
}

function showElectionResults() {
    $('screen-counting').classList.remove('active');
    document.body.style.overflow = '';

    const candidates = countingState.trueTargets;
    const sorted = [...candidates].sort((a, b) => b.target - a.target);
    const myResult = candidates.find(c => c.isMe);
    const myPercent = myResult.target;
    const myPlace = sorted.findIndex(c => c.isMe) + 1;
    const winner = sorted[0].isMe;
    const passed = myPercent >= 5;

    let won = 0;
    MACRO_REGIONS.forEach(r => {
        if (getFinalRating(r.code) > 50) won++;
    });

    let fraudText = '';
    if (state.party.id === 'er' && countingState.fraudBonus > 0) {
        fraudText = `<p style="color:var(--purple);font-weight:700">
            🎭 Применено ${countingState.fraudPoints} очков фальсификации: <strong>+${countingState.fraudBonus.toFixed(2)}%</strong>.
        </p>`;
    }

    const body = `
        <p>Итоги голосования:</p>
        ${sorted.map((r, i) => `
            <div class="rank-row ${r.isMe ? 'me' : ''}">
                <div class="rank-pos">${i + 1}</div>
                <div class="rank-name" style="color:${r.isMe ? '#fff' : r.color}">${r.name}${r.isMe ? ' (вы)' : ''}</div>
                <div class="rank-pct">${r.target.toFixed(2)}%</div>
            </div>
        `).join('')}
        ${fraudText}
        <p style="margin-top:16px">
            <strong>Ваше место:</strong> ${myPlace} из ${candidates.length}<br>
            <strong>Взято регионов:</strong> ${won} из ${MACRO_REGIONS.length}<br>
            <strong>Явка:</strong> ${countingState.targetTurnout.toFixed(1)}%<br>
            <strong>Обработано бюллетеней:</strong> ${countingState.totalBulletins.toLocaleString('ru-RU')}<br>
            <strong>Нарушений:</strong> ${countingState.violations}
        </p>
        <p style="margin-top:12px">
            ${winner
                ? '🏆 <strong>Победа!</strong> Вы формируете правительство.'
                : passed
                    ? `📊 <strong>Барьер пройден.</strong> Ваше место — ${myPlace}.`
                    : '💀 <strong>Провал.</strong> Партия не преодолела барьер.'}
        </p>
    `;

    showModal({
        type: winner ? 'success' : passed ? 'economy' : 'scandal',
        eyebrow: `Итоги выборов 2026`,
        title: winner ? 'Победа!' : passed ? `Место ${myPlace}` : 'Провал',
        eventId: winner ? 'win' : (passed ? 'passed' : 'fail'),
        body,
        answers: [
            { letter: '↻', label: 'Новая кампания', effect: 'Начать заново', action: () => location.reload() }
        ]
    });
}

function renderAll() {
    renderHUD();
    renderRegions();
    renderOrders();
    renderStaff();
    renderKompromat();
    renderPartiesInfo();
    renderLog();
}

const themeBtn = $('theme-toggle');
if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-theme');
    themeBtn.textContent = '☀️';
}
themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-theme');
    themeBtn.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
    localStorage.setItem('theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
    if (state.party) applyPartyTheme(state.party);
});

renderParties();
setTab('regions');
</script>
